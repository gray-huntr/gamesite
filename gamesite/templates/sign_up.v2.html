<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign up</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
          integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
            integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx"
            crossorigin="anonymous"></script>
</head>
<body style="background: linear-gradient(45deg, #d9534f, #0275d8);">


<section>
    <div class="d-flex justify-content-center align-content-center vh-100">

        <div class="container mt-auto mb-auto w-50 p-5 text-light shadow-lg" style="border-radius: 2%;">
            <h1 class="mt-2 mb-2">SiGN UP</h1>
            <h2 class="mb-2">{{ msg }}</h2>
            <form action="/" method="post">
                <div class="form-row mb-1">
                    <div class="col">
                        <label class="form-label">Username</label>
                        <input type="text" required name="username" class="form-control rounded border-0">
                    </div>
                    <div class="col">
                        <label class="form-label">Full Name</label>
                        <input type="text" required name="name" class="form-control rounded border-0">
                    </div>
                </div>

                <div class="form-row mb-1">
                    <div class="col">
                        <label class="form-label">Phone Number</label>
                        <input type="number" required name="phone" class="form-control rounded border-0">
                    </div>
                    <div class="col">
                        <label class="form-label">Email</label>
                        <input type="email" required name="email" class="form-control rounded border-0">
                    </div>
                </div>


                <div class="form-row mb-1">
                    <div class="col">
                        <label class="form-label">Password</label>
                        <input type="password" required name="password" class="form-control rounded border-0">
                    </div>
                    <div class="col">
                        <label class="form-label">Repeat Password</label>

                        <input type="password" required name="repeat_pass" class="form-control rounded border-0">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Delivery Location</label>
                    <input type="text" required name="location" class="form-control rounded border-0">
                </div>

                <div>
                    <input type="submit" value="Sign up" class="btn btn-primary rounded w-50 mb-2">
                </div>

                <a href="/users_login" class="text-light text-decoration-underline">Already have an account?</a>
            </form>
        </div>
    </div>
</section>
</body>
</html>
