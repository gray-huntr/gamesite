<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Games</title>
    <link rel="stylesheet" href="../static/css/bootstrap.css">

    <!-- we will need jquery file later -->
    <script type="text/javascript" src="../static/js/jquery.js"></script>

    <!-- below is a javascript file,,helps in interactivity -->
    <!-- jQuery and JS bundle w/ Popper.js -  Interactivity-->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
            integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx"
            crossorigin="anonymous"></script>

    <script src='https://kit.fontawesome.com/a076d05399.js'></script>
    <link rel="stylesheet" href="{{ url_for('static', filename="css/styles.css") }}">
</head>
<body style="background: linear-gradient(45deg, #d9534f, #0275d8);">
{% include 'navbar.html' %}
<section class="row">
    <div class="col-md-10">
        <H2 class="text-center text-danger"><b>GAMES</b></H2>
        <hr class="bg-danger" width="75%">
        <h3 class=" text-white text-center">Here are some of the games that we currently offer. Enjoy....</h3>
    </div>

    <div class="col-md-2">
        <form action="/games_search" method="post">
            <input type="text" name="games_search">
            <input type="submit" value="search">
        </form>
    </div>
</section>


<section class="row">
    {% for row in rows %}
        <div  class="col-md-3 " style="overflow: hidden; border-radius: 4%">
            <div class="">
                <a href="/purchase_games/{{ row[0] }}"><img src="static/games/{{ row[2] }}"
                                                            alt=""   height="300" width="100%" ></a>
                <div class="mt-auto shadow-lg w-100 text-light text-center p-2" style="background: rgba(0, 0, 0, 0.1);
                backdrop-filter: blur(5px);">
                    <h3><b class="card-title text-light">{{ row[1] }}</b></h3> <br>
                    <b><p class=""> KSH: {{ row[3] }}</p></b>
                    <a href="/purchase_games/{{ row[0] }}" class="btn btn-outline-danger">ORDER</a>
                </div>
            </div>
        </div>
    {% endfor %}
</section>

<hr class="bg-danger" width="75%">
<hr class="bg-primary" width="75%">

{% include 'footer.html' %}
</body>
</html>
