<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tech</title>
    <link rel="stylesheet" href="../static/css/bootstrap.css">

	<!-- we will need jquery file later -->
	<script type="text/javascript" src="../static/js/jquery.js"></script>

	<!-- below is a javascript file,,helps in interactivity -->
	<script type="text/javascript" src="../static/js/bootstrap.js"></script>
	<script src='https://kit.fontawesome.com/a076d05399.js'></script>
    <link rel="stylesheet" href="{{ url_for('static', filename="css/styles.css") }}">
</head>
<body style="background: linear-gradient(45deg, #d9534f, #0275d8);">
{% include 'navbar.html' %}
<section class="row">
	<div class="col-md-10">
		<h2 class="text-primary text-center"> <b>OUR TECH</b></h2>
		<hr class="bg-primary">
		<h3 class="text-center text-white ">Here are the best gaming tech that we can offer currently. Buy for a better gaming experience. Enjoy... </h3>
	</div>

	<div class="col-md-2">
		<form action="/tech_search" method="post">
				<input type="text" name="tech_search">
				<input type="submit" value="search">
		</form>
	</div>
</section>

<section class="row" >
	{% for row in rows %}
	<div class="col-md-4 mb-4" style="overflow: hidden; border-radius: 4%">
		<div class="">
<!--			image-->
			<a href="/purchase_tech/{{row[0]}}"><img src="static/tech/{{row[2]}}" height="300" width="100%" alt=""></a>
			<div class="mt-auto shadow-lg w-100 text-light text-center p-2" style="background: rgba(0, 0, 0, 0.1);
                backdrop-filter: blur(5px);">
<!--				name of product-->
				<h3><b class="card-title text-white" >{{ row[1] }}</b></h3> <br>
<!--				cost-->
				<p class="text-white"> KSH: {{ row[3] }}</p><br>
<!--				order button-->
				<a href="/purchase_tech/{{row[0]}}" class="btn btn-outline-primary">ORDER</a>
			</div>
		</div>
	</div>
	{% endfor %}
</section>
<hr class="bg-primary" width="75%">
<hr class="bg-danger" width="75%">
{% include 'footer.html' %}
</body>
</html>
